spec:
  inputs:
    pipeline_action:
      description: "Select the custom pipeline to execute"
      type: string
      options:
        - npm_audit
        - mirror_tag_to_github_manual
      default: npm_audit
    
    deploy_tag:
      description: "Tag to mirror to GitHub (e.g., v3.1.0) - required for mirror_tag_to_github_manual"
      type: string
      default: ""

---
image: node:24.22.1

stages:
  - release
  - security

variables:
  GIT_DEPTH: 5000  # include the last five hundred commits
  PIPELINE_ACTION: "$[[ inputs.pipeline_action ]]"
  DEPLOY_TAG: "$[[ inputs.deploy_tag ]]"

# ===== Automatic Pipelines =====

# 1. Tagged releases (v3.*.*)

mirror_tag_to_github:
  stage: release
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v3\.\d+\.\d+$/'
  script:
    - apk add --no-cache git
    - git config --global user.name "$GIT_USER_NAME"
    - git config --global user.email "$GIT_USER_EMAIL"
    - git fetch --unshallow --tags origin || git fetch --depth=10000 --tags origin
    - git checkout "$CI_COMMIT_TAG"
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/geodatenanwendungenhamburg/addons.git
    - git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
    - git push --force github "refs/tags/$CI_COMMIT_TAG:refs/tags/latest"

# ===== Custom Pipelines (triggered manually) =====

mirror_tag_to_github_manual:
  stage: release
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "mirror_tag_to_github_manual"'
  script:
    - 'if [ -z "$DEPLOY_TAG" ]; then echo "ERROR: deploy_tag input is required." && exit 1; fi'
    - apk add --no-cache git
    - git config --global user.name "$GIT_USER_NAME"
    - git config --global user.email "$GIT_USER_EMAIL"
    - git fetch --unshallow --tags origin || git fetch --depth=10000 --tags origin
    - git checkout "tags/$DEPLOY_TAG"
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/geodatenanwendungenhamburg/addons.git
    - echo "mirror to GitHub tag $DEPLOY_TAG"
    - git push github "refs/tags/$DEPLOY_TAG:refs/tags/$DEPLOY_TAG"
    - git push --force github "refs/tags/$DEPLOY_TAG:refs/tags/latest"

npm_audit_security:
  stage: security
  cache:
    paths:
      - node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "npm_audit"'
  script:
    - npm install
    - npm audit --json